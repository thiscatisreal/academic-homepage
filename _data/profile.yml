short_bio_ko: >-
  <p>
    Python 기반 AI/LLM 추론 파이프라인과 Backend API를 설계·운영하는 인공지능 엔지니어입니다.
    OpenAI·Gemini 멀티모달 LLM, JSON Schema 구조화 출력, Vision-LLM 데이터 품질 자동화,
    그리고 제조 공정 예측·제어까지 제품에 붙인 경험이 있습니다.
  </p>
  <p>
    현재 (주)소울소프트에서 맞춤형 헬스케어 서비스의 음식 인식·영양 추정, 비침습 질환 예측,
    LLM 운영 안정화를 담당하고 있습니다. 이전에는 (주)인이지에서 유리 용해로 연료 최적화 모델을
    현장에 적용해 현장 테스트에서 연료 사용량을 3.59% 줄이고, 관련 특허를 등록했습니다.
  </p>
short_bio_en: >-
  <p>
    I am an AI engineer who designs and operates Python-based AI/LLM inference pipelines and backend APIs.
    My work covers multimodal LLMs (OpenAI, Gemini), schema-constrained generation, Vision-LLM data-quality automation,
    and deploying process-control models on the factory floor.
  </p>
  <p>
    At SOULSOFT I work on food recognition, nutrition estimation, non-invasive disease-risk models, and LLM reliability
    for a personalized healthcare product. Previously at INEEJI I applied a glass-furnace temperature prediction and
    fuel-control system on site, cutting fuel use by 3.59% in plant tests and contributing to a registered patent.
  </p>

